<!--
  Klistra in detta i ett Custom HTML-block på WordPress-sidan /biluthyrning/
  Visar en spinner medan Render-appen startar (cold-start ~30s på free-tier).
-->
<style>
  .wp-block-html { padding: 0 !important; margin: 0 !important; max-width: 100% !important; }
  #loading-overlay {
    display: flex; align-items: center; justify-content: center;
    height: 150vh; background: #F0F4F8;
    font-family: Inter, sans-serif; font-size: 16px; color: #2B6CB0; gap: 12px;
  }
  #loading-overlay::before {
    content: ''; width: 24px; height: 24px; border: 3px solid #BEE3F8;
    border-top-color: #2B6CB0; border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #biluthyrning-frame { display: none; width: 100%; height: 150vh; border: none; }
</style>
<div id="loading-overlay">Laddar biluthyrning…</div>
<iframe
  id="biluthyrning-frame"
  src="https://biltuthyrning.onrender.com"
  onload="this.style.display='block'; document.getElementById('loading-overlay').style.display='none';"
  title="Biluthyrning">
</iframe>
