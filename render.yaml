services:
  - type: web
    name: biluthyrning
    runtime: docker
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false   # sätts manuellt i Render-dashboarden

databases:
  - name: biluthyrning-db
    databaseName: biluthyrning
    plan: free
