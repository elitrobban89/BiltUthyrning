services:
  - type: web
    name: biluthyrning
    runtime: docker
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: biluthyrning-db
          property: connectionString

databases:
  - name: biluthyrning-db
    databaseName: biluthyrning
    plan: free
