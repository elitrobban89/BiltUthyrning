spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1800000

server.port=${PORT:8080}

spring.thymeleaf.cache=true

server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# CSRF-cookien (XSRF-TOKEN) måste matcha sessionscookien i cross-site-iframen på WordPress,
# annars blockeras den (default Lax) och POST /login får 403. Läses av SecurityConfig.
app.csrf-cookie.same-site=none
app.csrf-cookie.secure=true

# Render terminerar TLS i sin proxy; låt Spring lita på X-Forwarded-* så Secure-cookies
# och https-redirects fungerar bakom proxyn.
server.forward-headers-strategy=framework
