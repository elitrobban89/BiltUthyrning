<!DOCTYPE html>
<!-- BilUthyrning — (c) 2026 Robert Andersson Kopler. Alla rattigheter forbehallna. -->
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BilUthyrning – Logga in</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="auth-page">
<div class="aurora-bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
</div>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <div class="logo-bg"></div>
                <div class="logo-ring"></div>
                <div class="logo-ring-2"></div>
                <span class="auth-icon">🚗</span>
            </div>
            <h1>BilUthyrning</h1>
            <p class="auth-tagline">Hantera din bilflotta, smidigt.</p>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" id="tab-login" onclick="showTab('login')">Logga in</button>
            <button class="tab-btn" id="tab-register" onclick="showTab('register')">Registrera</button>
        </div>

        <!-- Login -->
        <div id="login-tab">
            <div th:if="${param.error}" class="alert alert-error">Felaktigt användarnamn eller lösenord.</div>
            <div th:if="${param.logout}" class="alert alert-success">Du har loggat ut.</div>
            <form method="post" th:action="@{/login}">
                <div class="form-group">
                    <label>Användarnamn</label>
                    <input type="text" name="username" placeholder="Ange användarnamn" autofocus required/>
                </div>
                <div class="form-group">
                    <label>Lösenord</label>
                    <input type="password" name="password" placeholder="Ange lösenord" required/>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Logga in</button>
            </form>
        </div>

        <!-- Register -->
        <div id="register-tab" style="display:none">
            <div th:if="${regError}" class="alert alert-error" th:text="${regError}"></div>
            <div th:if="${regSuccess}" class="alert alert-success" th:text="${regSuccess}"></div>
            <form method="post" th:action="@{/register}">
                <div class="form-group">
                    <label>Användarnamn</label>
                    <input type="text" name="username" placeholder="Välj användarnamn" required/>
                </div>
                <div class="form-group">
                    <label>Lösenord</label>
                    <input type="password" name="password" placeholder="Välj lösenord" required/>
                </div>
                <button type="submit" class="btn btn-secondary btn-full">Registrera</button>
            </form>
        </div>
    </div>

    <!-- Post it-lapp med demokontot. Systemet har ETT konto som alla kör på, och utan den
         här lappen stod besökaren framför en inloggning utan att veta vad hen skulle skriva.
         Klick fyller i fälten — snabbare än att skriva av, och omöjligt att stava fel. -->
    <div class="bu-postit" id="bu-postit" role="button" tabindex="0"
         onclick="fyllDemo()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();fyllDemo();}">
        <div class="bu-postit-tejp" aria-hidden="true"></div>
        <div class="bu-postit-rubrik">Demo-inlogg</div>
        <div class="bu-postit-rad"><span>Användare:</span><b>admin</b></div>
        <div class="bu-postit-rad"><span>Lösenord:</span><b>admin123</b></div>
        <div class="bu-postit-hint" id="bu-postit-hint">klicka på lappen så fylls rutorna i</div>
    </div>
</div>
<script>
function fyllDemo() {
    showTab('login');
    var form = document.querySelector('#login-tab form');
    if (!form) return;
    form.querySelector('input[name="username"]').value = 'admin';
    form.querySelector('input[name="password"]').value = 'admin123';
    var hint = document.getElementById('bu-postit-hint');
    if (hint) hint.textContent = '✓ ifyllt — tryck Logga in';
    document.getElementById('bu-postit').classList.add('ifylld');
    var knapp = form.querySelector('button[type="submit"]');
    if (knapp) knapp.focus();
}

function showTab(tab) {
    document.getElementById('login-tab').style.display    = tab === 'login'    ? '' : 'none';
    document.getElementById('register-tab').style.display = tab === 'register' ? '' : 'none';
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
}
// Om det finns ett reg-meddelande, visa register-fliken direkt
if (document.querySelector('#register-tab .alert')) showTab('register');
</script>
</body>
</html>
