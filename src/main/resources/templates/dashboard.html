<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BilUthyrning</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- Aurora background -->
<div class="aurora-bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
</div>

<!-- Header -->
<header class="app-header">
    <div class="header-left">
        <span>🚗</span>
        <span class="header-title">BilUthyrning</span>
    </div>
    <div class="header-stats">
        <div class="header-stat">
            <span class="hstat-val stat-accent" th:text="${#lists.size(cars)}">0</span>
            <span class="hstat-label">bilar</span>
        </div>
        <div class="header-stat">
            <span class="hstat-val stat-green" th:text="${activeBookings}">0</span>
            <span class="hstat-label">aktiva</span>
        </div>
        <div class="header-stat">
            <span class="hstat-val stat-purple" th:text="${totalRevenue + ' kr'}">0 kr</span>
            <span class="hstat-label">intäkt</span>
        </div>
    </div>
    <div class="header-right">
        <span class="header-user">👤 <span th:text="${username}"></span></span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="btn-logout">Logga ut</button>
        </form>
    </div>
</header>

<!-- Flash messages -->
<div class="flash-container" th:if="${success != null or error != null}">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
</div>

<!-- Main layout -->
<div class="app-content">

    <!-- ── Left: car list ── -->
    <div class="car-panel">
        <h2 class="panel-heading">Tillgängliga bilar</h2>

        <div class="filter-row">
            <button class="filter-btn active" onclick="filterCars('Alla', this)">Alla</button>
            <button class="filter-btn"        onclick="filterCars('Bensin', this)">⛽ Bensin</button>
            <button class="filter-btn"        onclick="filterCars('Laddhybrid', this)">🔌 Laddhybrid</button>
            <button class="filter-btn"        onclick="filterCars('El', this)">⚡ El</button>
        </div>

        <div class="car-list" id="carList">
            <div th:each="car : ${cars}"
                 class="car-card"
                 th:attr="data-car-id=${car.id},
                           data-daily-rate=${car.dailyRate},
                           data-fuel=${@carUtils.getFuelType(car.engine)}"
                 onclick="selectCar(this)">

                <div class="car-badge-strip"
                     th:style="'background-color:' + ${@carUtils.getBadgeColor(car.model)}">
                    <span class="car-ev-badge" th:text="${@carUtils.getEVBadge(car.model)}"></span>
                    <span class="car-icon">🚗</span>
                </div>

                <div class="car-info">
                    <div class="car-name"   th:text="${car.model}"></div>
                    <div class="car-detail" th:text="${car.year + ' · ' + car.engine}"></div>
                    <div class="car-availability" th:id="'avail-' + ${car.id}"></div>
                </div>

                <div class="car-price-badge"
                     th:text="${car.dailyRate.intValue() + ' kr/dag'}"></div>
            </div>
        </div>
    </div>

    <!-- ── Right panel ── -->
    <div class="right-panel">

        <!-- Booking form -->
        <div class="card">
            <h2 class="card-title">Gör en bokning</h2>

            <div id="noCarHint" class="no-car-hint">
                <span class="no-car-hint-icon">←</span>
                <span>Välj en bil från listan för att göra en bokning</span>
            </div>

            <form th:action="@{/book}" method="post" id="bookingForm" onsubmit="return validateBooking()">
                <input type="hidden" name="carId" id="selectedCarId"/>

                <div class="date-row">
                    <div class="form-group">
                        <label>Startdatum</label>
                        <input type="date" name="startDate" id="startDate" required onchange="updatePrice()"/>
                    </div>
                    <div class="form-group">
                        <label>Slutdatum</label>
                        <input type="date" name="endDate" id="endDate" required onchange="updatePrice()"/>
                    </div>
                </div>

                <div id="dateWarning" class="alert alert-error" style="display:none;margin-bottom:8px">
                    Slutdatum måste vara efter startdatumet.
                </div>

                <div class="form-group">
                    <label>Kundnamn</label>
                    <input type="text" name="customerName" placeholder="Ange kundnamn" required/>
                </div>

                <div class="price-row">
                    <span class="price-label" id="priceLabel">Totalt pris: –</span>
                    <span class="availability-badge" id="availabilityBadge"></span>
                </div>

                <button type="submit" class="btn btn-primary">✔ Bekräfta bokning</button>
            </form>
        </div>

        <!-- Bookings table -->
        <div class="card bookings-card">
            <h2 class="card-title">Bokningar</h2>

            <div class="table-controls">
                <label>Visa:</label>
                <select id="statusFilter" onchange="applyBookingFilters()">
                    <option value="Alla">Alla</option>
                    <option value="CONFIRMED">Bekräftade</option>
                    <option value="CANCELLED">Avbokade</option>
                    <option value="COMPLETED">Avslutade</option>
                </select>
                <input type="text" id="bookingSearch" class="booking-search" placeholder="Sök kund…" oninput="applyBookingFilters()"/>
                <input type="date" id="filterFrom" onchange="applyBookingFilters()" title="Från datum"/>
                <span class="date-sep">–</span>
                <input type="date" id="filterTo" onchange="applyBookingFilters()" title="Till datum"/>
            </div>

            <div class="table-wrapper">
                <table class="bookings-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Bil</th>
                            <th>Kund</th>
                            <th>Start</th>
                            <th>Slut</th>
                            <th>Pris</th>
                            <th>Status</th>
                            <th>Åtgärd</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="b : ${bookings}" th:attr="data-status=${b.status.name()}">
                            <td th:text="${b.id}"></td>
                            <td th:text="${b.car.model}"></td>
                            <td th:text="${b.customerName}"></td>
                            <td th:text="${b.startDate}"></td>
                            <td th:text="${b.endDate}"></td>
                            <td th:text="${b.totalPrice.intValue() + ' kr'}"></td>
                            <td>
                                <span th:switch="${b.status.name()}">
                                    <span th:case="'CONFIRMED'" class="status-badge status-confirmed">Bekräftad</span>
                                    <span th:case="'CANCELLED'" class="status-badge status-cancelled">Avbokad</span>
                                    <span th:case="'COMPLETED'" class="status-badge status-completed">Avslutad</span>
                                </span>
                            </td>
                            <td>
                                <span th:if="${b.status.name() == 'CONFIRMED'}">
                                    <form th:action="@{/cancel/{id}(id=${b.id})}" method="post" style="display:inline">
                                        <button type="submit" class="btn btn-sm btn-danger">✖ Avboka</button>
                                    </form>
                                    <form th:action="@{/complete/{id}(id=${b.id})}" method="post" style="display:inline">
                                        <button type="submit" class="btn btn-sm btn-success">✔ Klar</button>
                                    </form>
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
